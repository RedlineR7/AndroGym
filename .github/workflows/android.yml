# The AndroGym sideload APK: build it, sign it when the repository has a key, keep the APK.
#
# The APK carries the repository's 180 px exercise media only (npm run build:mobile), so it can
# live in a public artifact. Signing is optional: with no secrets it builds unsigned, which is
# enough for `adb install` on a debug phone after signing with the local debug key.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of the .jks release keystore
#   ANDROID_KEYSTORE_PASSWORD   its store password
#   ANDROID_KEY_ALIAS           the key alias
#   ANDROID_KEY_PASSWORD        that key's password
name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `secrets` is not readable in a step's `if`, so it is turned into an env flag here.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      # Same cache as test.yml's android job: without it every run downloads the Gradle
      # distribution and the Android Gradle plugin again, which is where this workflow used
      # to die in its first twenty seconds.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: on-failure

      - name: Phone bundle + cap sync
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:mobile

      - name: Write the signing key, when one is configured
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/androgym-release.jks"

      - name: Build the sideload APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/androgym-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleSideloadRelease

      - name: Verify the signature
        if: env.HAS_KEYSTORE == 'true'
        working-directory: frontend/android
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs app/build/outputs/apk/sideload/release/app-sideload-release.apk

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: androgym-apk
          if-no-files-found: error
          path: frontend/android/app/build/outputs/apk/sideload/release/*.apk
