# Temporary: prints the tail of the Gradle failure in a log short enough to read.
name: Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Phone bundle + cap sync
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          npm run build:mobile >/dev/null 2>&1
      - name: Gradle, quiet on success and verbose only on failure
        working-directory: frontend/android
        run: |
          set +e
          ./gradlew --no-daemon --console=plain testSideloadDebugUnitTest assembleSideloadDebug :wear:compileReleaseKotlin > /tmp/g.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "gradle exited $rc"
            echo "--- environment ---"
            java -version 2>&1 | head -2
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1 | tail -8
            echo "--- tail of the Gradle log ---"
            tail -60 /tmp/g.log
            exit 1
          fi
          echo "gradle ok"; tail -4 /tmp/g.log
